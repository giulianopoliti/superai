# Activate only after the authenticated frontend and compatible backend pass
# acceptance. Back up existing sites, disable the old app/fastapi IP vhosts,
# bind Uvicorn to 127.0.0.1, and run nginx -t before reloading.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name stockiando.duckdns.org;
    # Production certbot uses the nginx authenticator, which injects its exact
    # HTTP challenge location. Keep redirects inside location / so that location
    # takes precedence. The separate preview vhost retains its webroot handler.
    location / { return 308 https://stockiando.duckdns.org$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/stockiando.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockiando.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 404;
}

server {
    listen 443 ssl;
    server_name stockiando.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/stockiando.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockiando.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Preserve current upload capacity until measurements through Vercel set a
    # compatible limit. The durable worker handles processing time separately.
    client_max_body_size 0;
    client_body_timeout 120s;

    location = /ui { return 404; }
    location ^~ /ui/ { return 404; }
    location = /procurement-ui { return 404; }
    location = /procurement-ui/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the caller's value; never create an origin credential here.
        proxy_set_header X-Stock-AI-Origin $http_x_stock_ai_origin;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
}
