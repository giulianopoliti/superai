# Additive virtual host. Existing IP-based HTTP access is retained until the cutover.
server {
    listen 80;
    server_name stockiando.duckdns.org;

    # 308 preserves the method and body of requests sent to the HTTP hostname.
    return 308 https://stockiando.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name stockiando.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/stockiando.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockiando.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Preserve the directly exposed Uvicorn upload capacity during the transition.
    # Replace with measured limits before the authenticated Vercel cutover.
    client_max_body_size 0;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Transitional synchronous backend; durable jobs must precede Vercel.
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
    }
}
