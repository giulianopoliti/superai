server {
    listen 80;
    server_name preview.stockiando.duckdns.org;
    location /.well-known/acme-challenge/ {
        root /var/lib/stock-ai-preview/acme;
    }
    location / { return 308 https://preview.stockiando.duckdns.org$request_uri; }
}

server {
    listen 443 ssl;
    server_name preview.stockiando.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/stock-ai-preview/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock-ai-preview/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;
    client_body_timeout 120s;
    location /ui { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 110s;
        proxy_send_timeout 110s;
    }
}
