services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_ai
      POSTGRES_USER: stock_ai
      POSTGRES_PASSWORD: stock_ai
    ports:
      - "5432:5432"
    volumes:
      - stock_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_ai -d stock_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stock_ai_postgres_data:
